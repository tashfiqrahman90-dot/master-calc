
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MASTER CALC</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff8a00">

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #101116;
  color: white;
  font-family: system-ui, Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 16px;
}

.app {
  width: 100%;
  max-width: 390px;
  background: #191a21;
  border: 1px solid #292a32;
  border-radius: 28px;
  padding: 22px;
  box-shadow: 0 20px 60px #0008;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
}

.brand {
  font-size: 19px;
  font-weight: 800;
  letter-spacing: 2px;
}

.brand span {
  color: #ff9d42;
}

.subtitle {
  color: #858691;
  font-size: 11px;
  letter-spacing: 2px;
  margin-top: 4px;
}

.history-btn {
  background: #292a32;
  color: white;
  border: 0;
  border-radius: 12px;
  padding: 12px;
  font-size: 17px;
}

.screen {
  min-height: 145px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: flex-end;
  padding: 15px 5px 22px;
  overflow: hidden;
}

#expression {
  color: #92939d;
  font-size: 19px;
  min-height: 28px;
  overflow-wrap: anywhere;
}

#display {
  font-size: clamp(36px, 12vw, 52px);
  font-weight: 600;
  letter-spacing: -2px;
  overflow-wrap: anywhere;
  max-width: 100%;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 11px;
}

button {
  height: 67px;
  border: 0;
  border-radius: 18px;
  background: #292a32;
  color: #f5f5f7;
  font-size: 23px;
  font-weight: 500;
  cursor: pointer;
  transition: transform .1s, filter .1s;
}

button:active {
  transform: scale(.94);
  filter: brightness(1.3);
}

.utility {
  color: #ffad62;
  background: #332a25;
}

.operator {
  color: #ffad62;
  background: #302923;
}

.equal {
  background: #ff963c;
  color: #171717;
  font-weight: 800;
}

.zero {
  grid-column: span 2;
}

.history {
  display: none;
  background: #22232b;
  padding: 15px;
  border-radius: 16px;
  margin-bottom: 15px;
  max-height: 180px;
  overflow-y: auto;
}

.history h3 {
  margin: 0 0 10px;
  font-size: 14px;
}

.history-item {
  color: #c6c6ce;
  padding: 8px 0;
  border-bottom: 1px solid #383943;
  font-size: 13px;
}

.footer {
  text-align: center;
  color: #777984;
  font-size: 10px;
  letter-spacing: 2px;
  margin-top: 22px;
}

</style>
</head>

<body>
<div class="app">

  <div class="header">
    <div>
      <div class="brand">MASTER <span>CALC.</span></div>
      <div class="subtitle">SMART CALCULATOR</div>
    </div>
    <button class="history-btn" onclick="toggleHistory()">◷</button>
  </div>

  <div class="history" id="history">
    <h3>Calculation History</h3>
    <div id="historyList">No calculations yet.</div>
  </div>

  <div class="screen">
    <div id="expression"></div>
    <div id="display">0</div>
  </div>

  <div class="buttons">
    <button class="utility" onclick="clearAll()">AC</button>
    <button class="utility" onclick="removeLast()">⌫</button>
    <button class="utility" onclick="percent()">%</button>
    <button class="operator" onclick="choose('/')">÷</button>

    <button onclick="input('7')">7</button>
    <button onclick="input('8')">8</button>
    <button onclick="input('9')">9</button>
    <button class="operator" onclick="choose('*')">×</button>

    <button onclick="input('4')">4</button>
    <button onclick="input('5')">5</button>
    <button onclick="input('6')">6</button>
    <button class="operator" onclick="choose('-')">−</button>

    <button onclick="input('1')">1</button>
    <button onclick="input('2')">2</button>
    <button onclick="input('3')">3</button>
    <button class="operator" onclick="choose('+')">+</button>

    <button class="zero" onclick="input('0')">0</button>
    <button onclick="decimal()">.</button>
    <button class="equal" onclick="calculate()">=</button>
  </div>

  <div class="footer">DESIGNED BY YOU • VERSION 1.0</div>
</div>

<script>
const display = document.getElementById("display");
const expression = document.getElementById("expression");
const historyList = document.getElementById("historyList");

let current = "0";
let first = null;
let operator = null;
let waiting = false;
let historyItems = [];

function render() {
  display.textContent = current;
}

function input(n) {
  if (waiting || current === "Error") {
    current = n;
    waiting = false;
  } else {
    current = current === "0" ? n : current + n;
  }
  render();
}

function decimal() {
  if (waiting || current === "Error") {
    current = "0.";
    waiting = false;
  } else if (!current.includes(".")) {
    current += ".";
  }
  render();
}

function choose(op) {
  if (current === "Error") return;

  if (operator && !waiting) calculate();

  first = Number(current);
  operator = op;
  waiting = true;

  const signs = {"+":"+","-":"−","*":"×","/":"÷"};
  expression.textContent = current + " " + signs[op];
}

function calculate() {
  if (first === null || operator === null || waiting) return;

  const second = Number(current);
  let result;

  switch(operator) {
    case "+": result = first + second; break;
    case "-": result = first - second; break;
    case "*": result = first * second; break;
    case "/":
      if (second === 0) {
        current = "Error";
        first = null;
        operator = null;
        waiting = true;
        expression.textContent = "Cannot divide by zero";
        render();
        return;
      }
      result = first / second;
      break;
  }

  const signs = {"+":"+","-":"−","*":"×","/":"÷"};
  const oldExpression =
    first + " " + signs[operator] + " " + second;

  current = String(Number(result.toPrecision(10)));

  expression.textContent = oldExpression + " =";
  addHistory(oldExpression + " = " + current);

  first = null;
  operator = null;
  waiting = true;
  render();
}

function clearAll() {
  current = "0";
  first = null;
  operator = null;
  waiting = false;
  expression.textContent = "";
  render();
}

function removeLast() {
  if (waiting || current === "Error") {
    current = "0";
    waiting = false;
  } else {
    current = current.length > 1
      ? current.slice(0, -1) : "0";
  }
  render();
}

function percent() {
  if (current !== "Error") {
    current = String(Number(current) / 100);
    render();
  }
}

function addHistory(item) {
  historyItems.unshift(item);
  historyItems = historyItems.slice(0, 20);

  historyList.innerHTML = "";
  historyItems.forEach(entry => {
    const div = document.createElement("div");
    div.className = "history-item";
    div.textContent = entry;
    historyList.appendChild(div);
  });

  try {
    localStorage.setItem(
      "masterCalcHistory",
      JSON.stringify(historyItems)
    );
  } catch(e) {}
}

function toggleHistory() {
  const panel = document.getElementById("history");
  panel.style.display =
    panel.style.display === "block" ? "none" : "block";
}

try {
  historyItems = JSON.parse(
    localStorage.getItem("masterCalcHistory") || "[]"
  );

  if (historyItems.length) {
    historyList.innerHTML = "";
    historyItems.forEach(entry => {
      const div = document.createElement("div");
      div.className = "history-item";
      div.textContent = entry;
      historyList.appendChild(div);
    });
  }
} catch(e) {
  historyItems = [];
}
</script>
</body>
</html>
